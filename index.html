<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>PlayNest — ভিডিও দেখুন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Adsterra Social Bar Script -->
<script data-cfasync="false" src="https://bicea.org/14/3751c47066d34edba00176f00bbb2187"></script>

<style>
:root{--bg:#090d18;--panel:#121a2a;--muted:#9ba8bd;--line:#ffffff18;--purple:#875cf6;--cyan:#22d3ee}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% -10%,#875cf629,transparent 34%),var(--bg);color:#f7f8fc;font-family:'Hind Siliguri',system-ui,sans-serif}
.wrap{max-width:1200px;margin:auto;padding:0 22px}
header{position:sticky;top:0;background:#090d18eF;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:4}
.nav{height:70px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-size:22px;font-weight:700;display:flex;align-items:center}
.logo{display:inline-grid;place-items:center;width:35px;height:35px;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--cyan));margin-right:8px}
.nav-right{display:flex;align-items:center;gap:10px}
.admin-btn { background: #8059ed; color: white; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; }
#adminBtn { display: none; }
.section{padding:18px 0 28px}
.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}
h2{font-size:22px;margin:0 0 4px}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.video{cursor:pointer;min-width:0}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:15px;background:#192438;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}
.video:hover img{transform:scale(1.04)}
.info{display:flex;gap:10px;padding-top:10px}
.avatar{width:33px;height:33px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--cyan));font-weight:700;flex:none}
.info h3{font-size:15px;line-height:1.4;margin:0 0 4px}
.meta-row{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.list-like-btn { background: none; border: 0; cursor: pointer; padding: 0; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; font-family: inherit; color: #f43f5e; }
.list-like-btn:hover { opacity: 0.8; }
.empty{display:block;padding:35px;text-align:center;border:1px dashed var(--line);border-radius:15px;color:var(--muted);grid-column:1/-1;font-size:16px}
footer{border-top:1px solid var(--line);margin-top:24px;padding:25px 0;color:var(--muted);font-size:15px;text-align:center}
.modal{display:none;position:fixed;inset:0;z-index:10;background:#02040beF;padding:18px;place-items:center;overflow-y:auto}
.modal.show{display:grid}
.dialog{max-width:510px;width:100%;background:#121a2a;border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 25px 80px #0009;text-align:left}
.dialog h2{font-size:20px;margin-bottom:10px}
.gate-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--line); }
.ad-btn { display: block; width: 100%; padding: 15px; background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-weight: 700; border: 0; border-radius: 12px; cursor: pointer; font-size: 16px; text-decoration: none; text-align: center; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
.video-desc { background: #080b14; padding: 12px; border-radius: 10px; margin-top: 12px; font-size: 14px; color: #cbd5e1; word-break: break-all; white-space: pre-wrap; }
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.wrap{padding:0 15px}.nav{height:64px;gap:10px}.brand{font-size:19px}.grid{gap:16px 12px}.info h3{font-size:14px}}
</style>
</head>
<body>
<header><div class="wrap nav">
 <div class="brand"><span class="logo">▶</span>PlayNest</div>
 <div class="nav-right">
    <a href="admin.html" id="adminBtn" class="admin-btn">Admin Panel</a>
 </div>
</div></header>

<main class="wrap">
<section class="section" id="videos">
<div class="head"><div><h2>ভিডিও দেখতে ভিডিওতে ক্লিক করুন</h2></div></div>
<div class="grid" id="grid">
    <div class="empty" id="empty">ভিডিও লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</div>
</div>
</section>
</main>

<footer>
    <div class="wrap">ভাইরাল ভিডিও দেখতে আমাদের সাথেই থাকুন ধন্যবাদ</div>
</footer>

<!-- অ্যাড গেট মোডাল -->
<div class="modal" id="gate" role="dialog" aria-modal="true">
<div class="dialog" style="text-align:center;">
<h2 id="gateTitle">ভিডিও দেখতে ক্লিক করুন</h2>
<img id="gateThumb" class="gate-thumb" src="" alt="Thumbnail">
<p style="text-align:left; color:#bac5d7; font-size:14px; margin-bottom:20px;">ভিডিওটি আনলক করতে নিচের বাটনে ক্লিক করে স্পন্সর বিজ্ঞাপন পেজটি একবার ভিজিট করুন।</p>
<a href="https://tinyurl.com/ewyefaw8" id="smartLinkBtn" class="ad-btn" target="_blank">▶ ভিডিও দেখতে ক্লিক করুন</a>
<div style="margin-top:15px;text-align:right;"><button onclick="closeGate()" style="background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:14px;">বাতিল করুন</button></div>
</div>
</div>

<!-- ভিডিও প্লেয়ার মোডাল -->
<div class="modal" id="player" role="dialog" aria-modal="true">
<div class="dialog">
<h2 id="playerTitle">ভিডিও প্লেয়ার</h2>
<video id="videoEl" controls playsinline style="width:100%;max-height:45vh;background:#000;border-radius:12px;display:none"></video>
<div class="video-desc" id="playerDesc"></div>
<div style="margin-top:18px;text-align:right;"><button class="admin-btn" id="closePlayer" style="display:inline-block;border:0;cursor:pointer;">বন্ধ করুন</button></div>
</div>
</div>

<script>
const DB_URL = "https://playnest-f4c56-default-rtdb.firebaseio.com";
const SMART_LINK = "https://tinyurl.com/ewyefaw8";

if(window.location.hash === '#admin') {
    document.getElementById('adminBtn').style.display = 'inline-flex';
}

let selectedKey = null, selectedData = null;
let allVideosData = {};
const gate = document.getElementById('gate');
const smartLinkBtn = document.getElementById('smartLinkBtn');

async function loadFirebaseVideos() {
    const grid = document.getElementById('grid');
    
    try {
        let res = await fetch(`${DB_URL}/videos.json`);
        let data = await res.json();
        
        grid.innerHTML = "";
        
        if (!data) {
            grid.innerHTML = `<div class="empty" id="empty">বর্তমানে কোনো ভিডিও নেই। নতুন ভিডিও শীঘ্রই আসছে।</div>`;
            return;
        }
        
        allVideosData = data;

        let keys = Object.keys(data).reverse();
        keys.forEach(key => {
            let v = data[key];
            let views = v.views || 0;
            let likes = v.likes || 0;

            let article = document.createElement('article');
            article.className = 'video';
            
            article.innerHTML = `
                <div class="thumb">
                    <img src="${v.thumb}" alt="${v.title}">
                </div>
                <div class="info">
                    <div class="avatar">P</div>
                    <div style="flex:1;min-width:0;">
                        <h3>${v.title}</h3>
                        <div class="meta-row">
                            <span>👁️ ${views} views</span>
                            <span>•</span>
                            <button class="list-like-btn" onclick="handleLike(event, '${key}')">❤️ <span id="like-count-${key}">${likes}</span></button>
                        </div>
                    </div>
                </div>
            `;
            
            article.querySelector('.thumb').addEventListener('click', () => {
                openGate(key, v);
            });
            article.querySelector('h3').addEventListener('click', () => {
                openGate(key, v);
            });

            grid.appendChild(article);
        });

        checkUrlHash();

    } catch (e) {
        grid.innerHTML = `<div class="empty" id="empty">ভিডিও লোড করতে সমস্যা হয়েছে।</div>`;
    }
}

function openGate(key, v) {
    selectedKey = key;
    selectedData = v;
    document.getElementById('gateTitle').textContent = v.title;
    document.getElementById('gateThumb').src = v.thumb;
    gate.classList.add('show');
}

function checkUrlHash() {
    if(window.location.hash.startsWith('#v=')) {
        let targetKey = window.location.hash.replace('#v=', '');
        if(allVideosData[targetKey]) {
            openGate(targetKey, allVideosData[targetKey]);
        }
    }
}

window.handleLike = async function(event, key) {
    event.stopPropagation();
    const countSpan = document.getElementById(`like-count-${key}`);
    let currentLikes = parseInt(countSpan.textContent) || 0;
    currentLikes++;
    countSpan.textContent = currentLikes;

    try {
        await fetch(`${DB_URL}/videos/${key}/likes.json`, {
            method: 'PUT',
            body: JSON.stringify(currentLikes)
        });
    } catch(e) {}
};

smartLinkBtn.onclick = async () => {
    gate.classList.remove('show'); 
    if (selectedKey && selectedData) {
        let currentViews = selectedData.views || 0;
        let newViews = currentViews + 1;
        
        try {
            await fetch(`${DB_URL}/videos/${selectedKey}/views.json`, {
                method: 'PUT',
                body: JSON.stringify(newViews)
            });
            selectedData.views = newViews;
        } catch(err) {}

        openPlayer(selectedData); 
    }
};

function closeGate() {
    gate.classList.remove('show');
    if(window.location.hash.startsWith('#v=')) {
        history.pushState("", document.title, window.location.pathname);
    }
}

function openPlayer(v) {
    document.getElementById('playerTitle').textContent = v.title;
    document.getElementById('playerDesc').textContent = v.desc || 'কোনো ডেসক্রিপশন নেই';
    
    const videoEl = document.getElementById('videoEl');
    if (v.videoUrl) {
        v.videoUrl = v.videoUrl.replace(/^['"]|['"]$/g, '').trim();
        videoEl.src = v.videoUrl;
        videoEl.style.display = 'block';
        videoEl.play().catch(()=>{})
    } else {
        videoEl.removeAttribute('src');
        videoEl.style.display = 'none';
    }

    document.getElementById('player').classList.add('show');
}

document.getElementById('closePlayer').onclick = () => {
    const videoEl = document.getElementById('videoEl');
    videoEl.pause();
    document.getElementById('player').classList.remove('show');
    if(window.location.hash.startsWith('#v=')) {
        history.pushState("", document.title, window.location.pathname);
    }
    loadFirebaseVideos();
};

loadFirebaseVideos();
</script>
</body>
</html>
