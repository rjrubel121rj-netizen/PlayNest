<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayNest — অ্যাডমিন প্যানেল</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d18;--panel:#121a2a;--muted:#9ba8bd;--line:#ffffff18;--purple:#875cf6;--cyan:#22d3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f7f8fc;font-family:'Hind Siliguri',sans-serif;padding:20px}
.wrap{max-width:650px;margin:auto}
.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 10px 30px #0009}
h2{margin-top:0;font-size:24px;color:#fff}
.form-group{margin-bottom:18px}
label{display:block;margin-bottom:6px;font-size:14px;color:var(--muted)}
input[type="text"], textarea {width:100%;padding:12px;background:#080b14;border:1px solid var(--line);border-radius:10px;color:#fff;font-size:15px;font-family:inherit}
input[type="file"]{width:100%;padding:10px;background:#080b14;border:1px solid var(--line);border-radius:10px;color:#fff;font-size:14px}
textarea{resize:vertical;height:90px}
button{width:100%;padding:14px;background:linear-gradient(135deg,var(--purple),var(--cyan));border:0;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
button:hover{opacity:0.9}
.video-list{margin-top:30px}
.vid-item{background:#080b14;padding:15px;border-radius:12px;border:1px solid var(--line);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.vid-info h4{margin:0 0 5px;font-size:16px}
.vid-info p{margin:0;font-size:12px;color:var(--muted)}
.del-btn{background:#ef4444;color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<div class="box">
<h2>একাধিক ভিডিও আপলোড প্যানেল</h2>
<p style="color:var(--muted);font-size:13px;margin-bottom:20px;">একসাথে একাধিক ভিডিও এবং থাম্বনেইল সিলেক্ট করে আপলোড করতে পারেন (যেকোনো সাইজ বা দীর্ঘ সময় দীর্ঘ ভিডিও)।</p>

<div class="form-group">
<label>ভিডিওর সাধারণ শিরোনাম বা ব্যাচ নাম</label>
<input type="text" id="title" placeholder="যেমন: নতুন ভাইরাল ভিডিও পর্ব...">
</div>

<div class="form-group">
<label>থাম্বনেইল ছবি সিলেক্ট করুন (একাধিক বা একটি)</label>
<input type="file" id="thumbFile" accept="image/*" multiple>
</div>

<div class="form-group">
<label>ভিডিও ফাইলসমূহ সিলেক্ট করুন (একাধিক একসাথে সিলেক্ট করতে পারবেন)</label>
<input type="file" id="videoFiles" accept="video/*" multiple>
</div>

<div class="form-group">
<label>ভিডিও ডেসক্রিপশন</label>
<textarea id="desc" placeholder="এখানে ডেসক্রিপশন দিন..."></textarea>
</div>

<button id="uploadBtn">সব ভিডিও একসাথে পাবলিশ করুন</button>
</div>

<div class="video-list">
<h3 style="font-size:18px;">পাবলিশ করা ভিডিওসমূহ</h3>
<div id="adminVideoList">লোড হচ্ছে...</div>
</div>
</div>

<script>
const DB_URL = "https://playnest-f4c56-default-rtdb.firebaseio.com";

function convertToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

document.getElementById('uploadBtn').onclick = async () => {
    const titleInput = document.getElementById('title').value.trim();
    const thumbFiles = document.getElementById('thumbFile').files;
    const videoFiles = document.getElementById('videoFiles').files;
    const desc = document.getElementById('desc').value.trim();

    if(!videoFiles.length) {
        alert('দয়া করে অন্তত একটি ভিডিও ফাইল সিলেক্ট করুন!');
        return;
    }

    document.getElementById('uploadBtn').textContent = "ভিডিও প্রসেস ও আপলোড হচ্ছে, দয়া করে অপেক্ষা করুন...";

    try {
        // একাধিক ভিডিও লুপ চালিয়ে একে একে আপলোড করার প্রসেস
        for (let i = 0; i < videoFiles.length; i++) {
            let vFile = videoFiles[i];
            let tFile = thumbFiles[i] || thumbFiles[0]; // থাম্বনেইল না থাকলে প্রথমটি বা ডিফল্ট ধরবে
            
            let videoBase64 = await convertToBase64(vFile);
            let thumbBase64 = tFile ? await convertToBase64(tFile) : '';

            let videoTitle = videoFiles.length > 1 ? `${titleInput || 'ভিডিও'} (${i + 1})` : (titleInput || vFile.name);

            let videoData = {
                title: videoTitle,
                thumb: thumbBase64,
                videoUrl: videoBase64,
                desc: desc,
                views: 0,
                likes: 0
            };

            await fetch(`${DB_URL}/videos.json`, {
                method: 'POST',
                body: JSON.stringify(videoData)
            });
        }

        alert('সব ভিডিও সফলভাবে পাবলিশ হয়েছে!');
        location.reload();

    } catch(err) {
        alert('ভিডিওর সাইজ খুব বড় হওয়ার কারণে ব্রাউজার বা ফায়ারবেজে সমস্যা হতে পারে। ছোট সাইজের ফাইল দিন অথবা ভিডিওর সংখ্যা কমিয়ে আপলোড করুন।');
        document.getElementById('uploadBtn').textContent = "সব ভিডিও একসাথে পাবলিশ করুন";
    }
};

async function loadAdminVideos() {
    const listDiv = document.getElementById('adminVideoList');
    try {
        let res = await fetch(`${DB_URL}/videos.json`);
        let data = await res.json();
        listDiv.innerHTML = "";
        if(!data) {
            listDiv.innerHTML = "<p style='color:var(--muted)'>কোনো ভিডিও নেই।</p>";
            return;
        }
        Object.keys(data).reverse().forEach(key => {
            let v = data[key];
            listDiv.innerHTML += `
                <div class="vid-item">
                    <div class="vid-info">
                        <h4>${v.title}</h4>
                        <p>ভিউ: ${v.views || 0} | লাইক: ${v.likes || 0}</p>
                    </div>
                    <button class="del-btn" onclick="deleteVideo('${key}')">ডিলিট</button>
                </div>
            `;
        });
    } catch(e) {
        listDiv.innerHTML = "<p style='color:var(--muted)'>লোড করতে সমস্যা হয়েছে।</p>";
    }
}

window.deleteVideo = async function(key) {
    if(confirm('সত্যিই ভিডিওটি ডিলিট করতে চান?')) {
        await fetch(`${DB_URL}/videos/${key}.json`, {method: 'DELETE'});
        location.reload();
    }
}

loadAdminVideos();
</script>
</body>
</html>
